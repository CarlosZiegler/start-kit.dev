name: bun-build

on:
  push:
    branches:
      - "test"
  pull_request:

concurrency:
  group: bun-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run --filter start-kit bun:build
        env:
          DATABASE_URL: postgresql://build:build@localhost:5432/build
          BETTER_AUTH_SECRET: build-secret-placeholder-minimum-32chars!
          RESEND_API_KEY: re_build_placeholder
          S3_ACCESS_KEY_ID: build-placeholder
          S3_SECRET_ACCESS_KEY: build-placeholder
          S3_BUCKET: build-placeholder
